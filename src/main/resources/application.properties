# Perfil "prod": se activa con SPRING_PROFILES_ACTIVE=prod (lo entrega systemd en AWS)
# Solo escucha en la interfaz local: el único acceso público es Nginx.
server.address=127.0.0.1
server.port=8082

# Las credenciales vienen del entorno; aquí no hay valores por defecto a propósito
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=ferreteria-auth
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN}
